<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GaO新聞メーカー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="badge">Whiteout Survival / GaO Tools</p>
        <h1>📰 GaO新聞メーカー</h1>
        <p class="lead">朝の同盟通知をサクッと作成・コピーできます。</p>
      </div>
    </header>

    <section class="card">
      <h2>朝通知作成</h2>

      <div class="grid-2">
        <div>
          <label>日付</label>
          <input id="noticeDate" type="text" />
        </div>

        <div>
          <label>移民開始日</label>
          <input id="migrationStartDate" type="date" />
        </div>
      </div>

      <label>移民日数</label>
      <input id="migrationDay" type="number" />

      <label>今日の予定</label>
      <div class="preset-buttons">
        <button type="button" onclick="addEventPreset('①21:00〜 熊【live】')">熊</button>
        <button type="button" onclick="addEventPreset('①21:00〜 兵器【live】')">兵器</button>
        <button type="button" onclick="addEventPreset('①20:00〜 峡谷')">峡谷</button>
        <button type="button" onclick="addEventPreset('①20:00〜 SVS')">SVS</button>
        <button type="button" onclick="addEventPreset('①砦要塞')">砦</button>
      </div>
      <textarea id="todayEvents" rows="4"></textarea>

      <label>特記事項</label>
      <textarea id="specialNotice" rows="6"></textarea>

      <button class="primary" onclick="generateNotice()">通知文を生成</button>
    </section>

    <section class="card">
      <h2>固定文言</h2>

      <label>あいさつ</label>
      <input id="greeting" type="text" />

      <label>冒頭文</label>
      <input id="intro" type="text" />

      <label>締め文</label>
      <textarea id="footer" rows="4"></textarea>

      <button onclick="saveSettings()">固定文言を保存</button>
    </section>

    <section class="card">
      <h2>週間イベント</h2>

      <label>週間テンプレ</label>
      <select id="weeklyTemplate" onchange="loadWeeklyTemplate()">
        <option value="normal">通常週</option>
        <option value="svsPrepare">SVS準備週</option>
        <option value="svsBattle">SVS戦闘週</option>
      </select>

      <div id="weeklyEditor"></div>

      <button onclick="saveWeeklyTemplate()">週間テンプレを保存</button>
    </section>

    <section class="card">
      <h2>生成結果</h2>
      <textarea id="result" rows="20"></textarea>
      <button class="primary" onclick="copyResult()">コピー</button>
    </section>
  </main>

  <div id="toast" class="toast">コピーしました</div>

  <script src="app.js"></script>
</body>
</html>
