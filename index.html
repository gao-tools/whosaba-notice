<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GaO新聞メーカー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="badge">Whiteout Survival / GaO Tools</p>
        <h1>📰 GaO新聞メーカー</h1>
        <p class="lead">朝の同盟通知をサクッと作成・コピーできます。</p>
      </div>
    </header>

    <section class="card">
      <h2>朝通知作成</h2>

      <div class="grid-2">
        <div>
          <label>日付</label>
          <input id="noticeDate" type="text" />
        </div>

      </div>

      <label>同盟経過日数(自動計算)</label>
      <input id="migrationDay" type="number" readonly class="readonly-field" />

      <label>今日の予定</label>
      <div class="preset-buttons-wrap">
        <div id="presetButtons" class="preset-buttons"></div>
      
        <button
          type="button"
          class="danger clear-button"
          onclick="clearTodayEvents()"
        >
          クリア
        </button>
      </div>
      <textarea id="todayEvents" rows="4"></textarea>
      
      <label>特記事項</label>

      <div class="preset-buttons-wrap">
        <div id="specialPresetButtons" class="preset-buttons"></div>
      
        <button
          type="button"
          class="danger clear-button"
          onclick="clearSpecialNotice()"
        >
          クリア
        </button>
      </div>
      
      <textarea id="specialNotice" rows="6"></textarea>

      <button class="primary" onclick="generateNotice()">通知文を生成</button>
    </section>

    <section class="card">
      <h2>週間イベント</h2>

      <label>週間テンプレ</label>
      <select id="weeklyTemplate" onchange="loadWeeklyTemplate()"></select>
      
      <label>テンプレタイトル</label>
      <input id="weeklyTemplateName" type="text" placeholder="例：通常週" />
      
      <div id="weeklyEditor"></div>
      
      <div class="button-row">
        <button type="button" onclick="addWeeklyTemplate()">＋ テンプレ追加</button>
        <button type="button" class="danger" onclick="deleteWeeklyTemplate()">削除</button>
      </div>
      
      <button type="button" class="primary" onclick="saveWeeklyTemplate()">週間テンプレを保存</button>
    </section>

    <section class="card">
      <h2>生成結果</h2>
      <textarea id="result" rows="20"></textarea>
      <button class="primary" onclick="copyResult()">コピー</button>
    </section>

      <section class="card collapsible-card">
      <details>
        <summary>⚙️ 固定文言</summary>

        <label>あいさつ</label>
        <input id="greeting" type="text" />
  
        <label>冒頭文</label>
        <input id="intro" type="text" />
  
        <label>締め文</label>
        <textarea id="footer" rows="4"></textarea>
  
        <button onclick="saveSettings()">固定文言を保存</button>
      </details>
    </section>

    <section class="card collapsible-card">
      <details>
        <summary>🎯 イベントプリセット管理</summary>
        <p class="hint">今日の予定に追加するボタンを編集できます。</p>
      
        <div id="presetEditor"></div>
      
        <button type="button" onclick="addPresetRow()">＋ プリセット追加</button>
        <button type="button" class="primary" onclick="saveEventPresets()">イベントプリセットを保存</button>
       </details>
    </section>

    <section class="card collapsible-card">
      <details>
        <summary>📝 特記事項プリセット管理</summary>
        <p class="hint">特記事項に追加するボタンを編集できます。</p>
      
        <div id="specialPresetEditor"></div>
      
        <button type="button" onclick="addSpecialPresetRow()">＋ プリセット追加</button>
        <button type="button" class="primary" onclick="saveSpecialPresets()">特記事項プリセットを保存</button>
      </details>
    </section>

  
  
  
  </main>

  <div id="toast" class="toast">コピーしました</div>

  <script src="app.js"></script>
</body>
</html>
